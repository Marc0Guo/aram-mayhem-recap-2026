appId: com.fanproject.arammayhemwrapped
productName: ARAM Mayhem Wrapped
copyright: Fan project. Not affiliated with Riot Games.
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
extraResources:
  - from: fixtures/demo/dataset.json
    to: fixtures/demo/dataset.json
win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ARAM Mayhem Wrapped
  installerLanguages:
    - zh_CN
    - en_US
  displayLanguageSelector: true
  runAfterFinish: true
npmRebuild: false
